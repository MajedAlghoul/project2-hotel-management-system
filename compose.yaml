services:
  mysql:
    image: 'mysql:latest'
    environment:
      - 'MYSQL_DATABASE=hms'
      - 'MYSQL_PASSWORD=1234'
      - 'MYSQL_ROOT_PASSWORD=1234'
      - 'MYSQL_USER=rootx'
    ports:
      - '3307:3306'

  app:
    build: .
    ports:
      - '8080:8080'
    depends_on:
      - mysql
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3307/hms
      - SPRING_DATASOURCE_USERNAME=rootx
      - SPRING_DATASOURCE_PASSWORD=1234
